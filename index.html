<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive CYOA</title>
    <meta
      name="description"
      content="Modular Choose Your Own Adventure engine with multiple story packs and replayable timelines."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/story.css" />
    <link rel="stylesheet" href="css/timeline.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="app-shell">
      <header class="topbar">
        <button id="home-button" class="secondary-button hidden">Story Select</button>
        <div class="brand-mark">ALT TIMELINES</div>
        <div class="topbar-actions">
          <button id="music-toggle" class="ghost-button">Music: Off</button>
          <button id="reset-button" class="ghost-button">Reset</button>
        </div>
      </header>

      <main id="screen-root">
        <section id="story-select-screen" class="screen active"></section>
        <section id="story-intro-screen" class="screen"></section>
        <section id="story-screen" class="screen"></section>
        <section id="timeline-screen" class="screen"></section>
      </main>
    </div>

    <audio id="bg-music" loop preload="auto">
      <source src="GTA Vice City Theme 5mins.m4a" type="audio/mp4" />
    </audio>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
